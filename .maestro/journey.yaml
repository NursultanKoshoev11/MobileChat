# Main user journey against the seeded CI backend (never production).
appId: com.nursultankoshoev.mobilechat.debug
name: Koom user journey
env:
  PHONE_LOCAL: "700000101"
  DISPLAY_NAME: "Maestro Journey"
  GROUP_TITLE: "Maestro QA Group"
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- takeScreenshot: 01_login
- runFlow: subflows/login.yaml
- extendedWaitUntil:
    visible: "(?s).*Maestro QA Group.*"
    timeout: 30000
- takeScreenshot: 02_groups

# Open the seeded group.
- tapOn: "(?s).*Maestro QA Group.*"
- extendedWaitUntil:
    visible: "Новая публикация"
    timeout: 30000
- takeScreenshot: 03_group

# Create a discussion post.
- tapOn: "Новая публикация"
- extendedWaitUntil:
    visible: "Опубликовать"
    timeout: 15000
- tapOn: "Заголовок"
- inputText: "Maestro post"
- tapOn: "Описание"
- inputText: "Created by the Maestro journey"
- hideKeyboard
- tapOn: "(?s).*Только текст.*"
- tapOn: "Обсуждение с комментариями"
- takeScreenshot: 04_new_post
- tapOn: "Опубликовать"
- extendedWaitUntil:
    visible: "(?s).*Maestro post.*"
    timeout: 30000
- takeScreenshot: 05_post_created

# Vote on the new post (it is first in the feed).
- tapOn:
    text: "(?s)Поддерживаю.*"
    index: 0
- extendedWaitUntil:
    visible: "(?s).*Нажмите выбранный вариант ещё раз.*"
    timeout: 15000
- takeScreenshot: 06_voted

# Comment on it.
- tapOn:
    text: "(?s)Комментарии.*"
    index: 0
- extendedWaitUntil:
    visible: "Добавить комментарий"
    timeout: 15000
- tapOn: "Добавить комментарий"
- inputText: "Maestro comment"
- hideKeyboard
- tapOn: "Отправить"
- extendedWaitUntil:
    visible: "(?s).*Maestro comment.*"
    timeout: 15000
- takeScreenshot: 07_commented
- back

# Invite code / QR sheet.
- extendedWaitUntil:
    visible: "Новая публикация"
    timeout: 15000
- tapOn: "Меню"
- tapOn: "Код и QR"
- extendedWaitUntil:
    visible: "(?s).*Передайте этот код или QR.*"
    timeout: 15000
- takeScreenshot: 08_invite_qr
- back

# Tabs inside the group: members and statistics.
- extendedWaitUntil:
    visible: "(?s).*Участники.*"
    timeout: 15000
- tapOn: "(?s).*Участники.*"
- extendedWaitUntil:
    visible: "(?s).*${DISPLAY_NAME}.*"
    timeout: 20000
- takeScreenshot: 09_group_members
- tapOn: "(?s).*Статистика.*"
- extendedWaitUntil:
    visible: "(?s).*Месяц.*"
    timeout: 30000
- takeScreenshot: 10_group_statistics
- tapOn: "(?s).*Лента.*"
- extendedWaitUntil:
    visible: "Новая публикация"
    timeout: 15000
- back

# Notifications tab of the bottom navigation.
- extendedWaitUntil:
    visible: "(?s).*${GROUP_TITLE}.*"
    timeout: 15000
- tapOn: "(?s).*Уведомления.*"
- extendedWaitUntil:
    visible: "(?s).*Приглашения.*"
    timeout: 20000
- takeScreenshot: 11_notifications

# Profile tab of the bottom navigation.
- tapOn: "(?s).*Профиль.*"
- extendedWaitUntil:
    visible: "(?s).*Аккаунт.*"
    timeout: 15000
- assertVisible: "(?s).*${DISPLAY_NAME}.*"
- takeScreenshot: 12_profile

# App settings, reached from the groups tab.
- tapOn: "(?s).*Группы.*"
- extendedWaitUntil:
    visible: "(?s).*${GROUP_TITLE}.*"
    timeout: 15000
- tapOn: "Настройки"
- extendedWaitUntil:
    visible: "(?s).*Тема.*"
    timeout: 15000
- takeScreenshot: 13_settings
- tapOn: "Закрыть"

# Sign out, now an action near the bottom of the profile tab. The exact text
# matters here: the substring form would also match the button right below it,
# "Выйти на всех устройствах".
- tapOn: "(?s).*Профиль.*"
- extendedWaitUntil:
    visible: "(?s).*Аккаунт.*"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Выйти"
    direction: DOWN
    timeout: 20000
- tapOn: "Выйти"
- extendedWaitUntil:
    visible:
      id: auth_mobile_field
    timeout: 30000
- takeScreenshot: 14_signed_out

name: iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend API base URL for the iOS build."
        required: false
        default: "https://koom.com.kg"
      ios_bundle_id:
        description: "iOS bundle identifier. Must match your Apple provisioning profile for signed IPA."
        required: false
        default: "com.nursultankoshoev.mobilechat"

permissions:
  contents: read

jobs:
  build-ios-simulator:
    name: Build unsigned iOS simulator app
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show Flutter doctor
        run: flutter doctor -v

      - name: Ensure iOS platform files exist
        run: flutter create --platforms=ios --project-name koom .

      - name: Configure iOS bundle identifier
        run: |
          BUNDLE_ID="${{ github.event.inputs.ios_bundle_id || 'com.nursultankoshoev.mobilechat' }}"
          echo "Using iOS bundle id: $BUNDLE_ID"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" ios/Runner/Info.plist || true
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" ios/Runner.xcodeproj/project.pbxproj

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build iOS simulator app
        run: |
          API_BASE_URL="${{ github.event.inputs.api_base_url || 'https://koom.com.kg' }}"
          echo "Building iOS simulator app with API_BASE_URL=$API_BASE_URL"
          flutter build ios --debug --simulator -t lib/main.dart --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Prepare simulator artifact
        run: |
          mkdir -p build-artifacts
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build-artifacts/Koom-iOS-simulator-app.zip
          shasum -a 256 build-artifacts/Koom-iOS-simulator-app.zip > build-artifacts/Koom-iOS-simulator-app.sha256.txt
          ls -lah build-artifacts

      - name: Upload simulator app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Koom-iOS-simulator-app
          path: |
            build-artifacts/Koom-iOS-simulator-app.zip
            build-artifacts/Koom-iOS-simulator-app.sha256.txt
          if-no-files-found: error
          retention-days: 14

  build-unsigned-ipa:
    name: Build unsigned iPhone IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show Flutter doctor
        run: flutter doctor -v

      - name: Ensure iOS platform files exist
        run: flutter create --platforms=ios --project-name koom .

      - name: Configure iOS bundle identifier
        run: |
          BUNDLE_ID="${{ github.event.inputs.ios_bundle_id || 'com.nursultankoshoev.mobilechat' }}"
          echo "Using iOS bundle id: $BUNDLE_ID"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" ios/Runner/Info.plist || true
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/g" ios/Runner.xcodeproj/project.pbxproj

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build unsigned iPhone app
        run: |
          API_BASE_URL="${{ github.event.inputs.api_base_url || 'https://koom.com.kg' }}"
          echo "Building unsigned iPhone app with API_BASE_URL=$API_BASE_URL"
          flutter build ios --release --no-codesign -t lib/main.dart --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Package unsigned IPA artifact
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "No iPhone app bundle found at $APP_PATH"
            exit 1
          fi
          rm -rf build-artifacts
          mkdir -p build-artifacts/Payload
          cp -R "$APP_PATH" build-artifacts/Payload/Runner.app
          (cd build-artifacts && zip -qry Koom-unsigned.ipa Payload)
          shasum -a 256 build-artifacts/Koom-unsigned.ipa > build-artifacts/Koom-unsigned.sha256.txt
          ls -lah build-artifacts

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Koom-unsigned-ipa
          path: |
            build-artifacts/Koom-unsigned.ipa
            build-artifacts/Koom-unsigned.sha256.txt
          if-no-files-found: error
          retention-days: 14

  build-signed-ipa:
    name: Build signed iPhone IPA
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: ios-production
    runs-on: macos-15

    steps:
      - name: Check signing secrets
        id: signing
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          SIGNING_READY=true
          for name in IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_EXPORT_OPTIONS_PLIST_BASE64; do
            if [ -z "${!name}" ]; then
              SIGNING_READY=false
            fi
          done
          APP_STORE_READY=true
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              APP_STORE_READY=false
            fi
          done

          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if [ "$SIGNING_READY" != "true" ] || [ "$APP_STORE_READY" != "true" ]; then
              echo "::error::Main-branch iOS releases require all four IOS_* signing secrets plus APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, and APP_STORE_CONNECT_API_KEY_P8_BASE64."
              exit 1
            fi
          fi

          if [ "$SIGNING_READY" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets are not configured. Signed IPA build will be skipped for this manual build."
          fi

      - name: Checkout repository
        if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Flutter
        if: steps.signing.outputs.ready == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Xcode version
        if: steps.signing.outputs.ready == 'true'
        run: xcodebuild -version

      - name: Show Flutter doctor
        if: steps.signing.outputs.ready == 'true'
        run: flutter doctor -v

      - name: Ensure iOS platform files exist
        if: steps.signing.outputs.ready == 'true'
        run: flutter create --platforms=ios --project-name koom .

      - name: Configure iOS bundle identifier
        if: steps.signing.outputs.ready == 'true'
        run: |
          BUNDLE_ID="${{ github.event.inputs.ios_bundle_id || 'com.nursultankoshoev.mobilechat' }}"
          echo "Using iOS bundle id: $BUNDLE_ID"
          echo "IOS_BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" ios/Runner/Info.plist || true
          IOS_BUNDLE_ID="$BUNDLE_ID" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          source = path.read_text(encoding="utf-8")
          bundle_id = os.environ["IOS_BUNDLE_ID"]

          def replace_bundle(match):
              old_id = match.group(1)
              new_id = f"{bundle_id}.RunnerTests" if old_id.endswith(".RunnerTests") else bundle_id
              return f"PRODUCT_BUNDLE_IDENTIFIER = {new_id};"

          updated, count = re.subn(r"PRODUCT_BUNDLE_IDENTIFIER = ([^;]+);", replace_bundle, source)
          if count < 2:
              raise SystemExit(f"Expected Runner and RunnerTests bundle IDs in the Xcode project; found {count}.")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Install Apple signing certificate and provisioning profile
        if: steps.signing.outputs.ready == 'true'
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/koom_certificate.p12"
          PROFILE_PATH="$RUNNER_TEMP/koom.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/koom-signing.keychain-db"
          KEYCHAIN_PASSWORD="${IOS_KEYCHAIN_PASSWORD:-koom-ci-keychain}"

          echo -n "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(.*\)"$/\1/p' | head -n 1)
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::No code-signing identity found in the imported certificate."
            exit 1
          fi
          echo "IOS_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          DECODED_PROFILE="$RUNNER_TEMP/koom_profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$DECODED_PROFILE"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$DECODED_PROFILE")
          PROFILE_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$DECODED_PROFILE")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$DECODED_PROFILE")
          APP_IDENTIFIER=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$DECODED_PROFILE")
          case "$APP_IDENTIFIER" in
            *".$IOS_BUNDLE_ID") ;;
            *) echo "::error::Provisioning profile app identifier does not match $IOS_BUNDLE_ID: $APP_IDENTIFIER"; exit 1 ;;
          esac
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "IOS_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "IOS_TEAM_ID=$PROFILE_TEAM_ID" >> "$GITHUB_ENV"

      - name: Decode export options plist
        if: steps.signing.outputs.ready == 'true'
        env:
          IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: echo -n "$IOS_EXPORT_OPTIONS_PLIST_BASE64" | base64 --decode > ios/ExportOptions.plist

      - name: Configure App Store signing in Xcode project
        if: steps.signing.outputs.ready == 'true'
        run: |
          EXPORT_TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :teamID' ios/ExportOptions.plist)
          EXPORT_PROFILE=$(/usr/libexec/PlistBuddy -c "Print :provisioningProfiles:$IOS_BUNDLE_ID" ios/ExportOptions.plist)
          if [ "$EXPORT_TEAM_ID" != "$IOS_TEAM_ID" ]; then
            echo "::error::Export options teamID does not match the provisioning profile team."
            exit 1
          fi
          if [ "$EXPORT_PROFILE" != "$IOS_PROFILE_UUID" ] && [ "$EXPORT_PROFILE" != "$IOS_PROFILE_NAME" ]; then
            echo "::error::Export options profile does not match the installed App Store provisioning profile."
            exit 1
          fi
          IOS_BUNDLE_ID="$IOS_BUNDLE_ID" IOS_TEAM_ID="$IOS_TEAM_ID" IOS_PROFILE_UUID="$IOS_PROFILE_UUID" IOS_SIGNING_IDENTITY="$IOS_SIGNING_IDENTITY" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          source = path.read_text(encoding="utf-8")
          bundle_id = os.environ["IOS_BUNDLE_ID"]
          team_id = os.environ["IOS_TEAM_ID"]
          profile_uuid = os.environ["IOS_PROFILE_UUID"]
          signing_identity = os.environ["IOS_SIGNING_IDENTITY"]
          pattern = rf"(?m)^([ \t]*)PRODUCT_BUNDLE_IDENTIFIER = {re.escape(bundle_id)};[ \t]*$"

          def add_signing_settings(match):
              indent = match.group(1)
              return "\n".join([
                  match.group(0),
                  f"{indent}CODE_SIGN_STYLE = Manual;",
                  f'{indent}CODE_SIGN_IDENTITY = "{signing_identity}";',
                  f"{indent}DEVELOPMENT_TEAM = {team_id};",
                  f"{indent}PROVISIONING_PROFILE_SPECIFIER = {profile_uuid};",
              ])

          updated, count = re.subn(pattern, add_signing_settings, source)
          if count != 3:
              raise SystemExit(f"Expected 3 Runner build configurations for {bundle_id}; found {count}.")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Install dependencies
        if: steps.signing.outputs.ready == 'true'
        run: flutter pub get

      - name: Build signed IPA
        if: steps.signing.outputs.ready == 'true'
        run: |
          API_BASE_URL="${{ github.event.inputs.api_base_url || 'https://koom.com.kg' }}"
          flutter build ipa --release -t lib/main.dart \
            --build-name="1.0.${{ github.run_number }}" \
            --build-number="${{ github.run_id }}.${{ github.run_attempt }}" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --export-options-plist=ios/ExportOptions.plist

      - name: Prepare IPA artifact
        if: steps.signing.outputs.ready == 'true'
        run: |
          mkdir -p build-artifacts
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found in build/ios/ipa"
            exit 1
          fi
          cp "$IPA_PATH" build-artifacts/Koom-signed.ipa
          shasum -a 256 build-artifacts/Koom-signed.ipa > build-artifacts/Koom-signed.sha256.txt
          ls -lah build-artifacts

      - name: Upload signed IPA artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Koom-signed-ipa
          path: |
            build-artifacts/Koom-signed.ipa
            build-artifacts/Koom-signed.sha256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Prepare App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          key = base64.b64decode(os.environ["APP_STORE_CONNECT_API_KEY_P8_BASE64"], validate=True).decode("utf-8")
          payload = {
              "key_id": os.environ["APP_STORE_CONNECT_API_KEY_ID"],
              "issuer_id": os.environ["APP_STORE_CONNECT_ISSUER_ID"],
              "key": key,
              "duration": 1200,
              "in_house": False,
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "koom-app-store-connect-key.json"
          path.write_text(json.dumps(payload), encoding="utf-8")
          path.chmod(0o600)
          PY

      - name: Upload signed IPA to TestFlight
        run: |
          IPA_PATH="$GITHUB_WORKSPACE/build-artifacts/Koom-signed.ipa"
          test -s "$IPA_PATH"
          fastlane pilot upload \
            --api_key_path "$RUNNER_TEMP/koom-app-store-connect-key.json" \
            --app_identifier com.nursultankoshoev.mobilechat \
            --ipa "$IPA_PATH" \
            --skip_submission \
            --skip_waiting_for_build_processing true
